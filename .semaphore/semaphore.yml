version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Check IPs list
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Notify change"
          commands:
            - echo "Checking out code..."
    run:
      when: branch = 'master' and change_in('ips-S2.txt')
